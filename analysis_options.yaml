# Shared analyzer configuration for every package in the VaultFlow workspace.
# Individual packages include this file via `include: ../../analysis_options.yaml`.
include: package:very_good_analysis/analysis_options.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.drift.dart"
    - "**/build/**"
    - "**/.dart_frog/**"

linter:
  rules:
    public_member_api_docs: false
    lines_longer_than_80_chars: false
    avoid_positional_boolean_parameters: false
    # Requires declaring-constructor syntax that Dart 3.13 stable does not ship yet.
    unnecessary_type_name_in_constructor: false
