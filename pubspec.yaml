name: vaultflow_workspace
description: VaultFlow monorepo — personal cloud vault and workspace (Flutter client + Dart server).
publish_to: none

environment:
  sdk: ^3.13.0

workspace:
  - apps/vaultflow_app
  - apps/vaultflow_server
  - packages/vf_core
  - packages/vf_protocol
  - packages/vf_domain
  - packages/vf_database
  - packages/vf_network
  - packages/vf_security
  - packages/vf_sync
  - packages/vf_transfer
  - packages/vf_ui

dev_dependencies:
  very_good_analysis: ^11.0.0

# package:sqlite3 3.x bundles SQLite through Dart hooks. Select the
# SQLite3MultipleCiphers build so the local database can be encrypted with
# `PRAGMA key` (see packages/vf_database/lib/src/connection/).
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
