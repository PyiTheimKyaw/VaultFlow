name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vaultflow_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d vaultflow_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      minio:
        image: bitnami/minio:latest
        env:
          MINIO_ROOT_USER: vaultflow
          MINIO_ROOT_PASSWORD: vaultflow-secret
          MINIO_DEFAULT_BUCKETS: vaultflow
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -sf http://localhost:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      # Enables the Postgres integration tests (they skip when unset).
      TEST_DATABASE_URL: postgres://test_user:test_password@localhost:5432/vaultflow_test
      # Enables the S3 storage tests against MinIO (they skip when unset).
      TEST_S3_ENDPOINT: localhost:9000
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Resolve workspace
        run: flutter pub get

      - name: Format
        run: dart format --set-exit-if-changed apps packages

      - name: Analyze
        run: dart analyze --fatal-infos .

      - name: Apply server migrations to the test database
        working-directory: apps/vaultflow_server
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: dart run bin/migrate.dart

      - name: Test pure-Dart packages
        run: |
          for dir in packages/vf_core packages/vf_protocol packages/vf_domain apps/vaultflow_server; do
            echo "::group::$dir"; (cd "$dir" && dart test --reporter github); echo "::endgroup::"
          done

      - name: Test Flutter packages
        run: |
          for dir in packages/vf_database packages/vf_network packages/vf_security packages/vf_sync packages/vf_transfer packages/vf_ui apps/vaultflow_app; do
            echo "::group::$dir"; (cd "$dir" && flutter test --reporter github); echo "::endgroup::"
          done
