name: vaultflow_app
description: VaultFlow — personal cloud vault and workspace (Flutter client).
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  crypto: ^3.0.7
  cupertino_icons: ^1.0.8
  desktop_drop: ^0.8.4
  drift: ^2.34.4
  file_picker: ^12.2.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  flutter_riverpod: ^3.4.3
  flutter_web_plugins:
    sdk: flutter
  go_router: ^18.0.1
  intl: ^0.20.2
  meta: ^1.16.0
  path: ^1.9.1
  path_provider: ^2.1.6
  riverpod_annotation: ^4.0.7
  sentry_flutter: ^9.30.0
  url_launcher: ^6.3.2
  vf_core:
    path: ../../packages/vf_core
  vf_database:
    path: ../../packages/vf_database
  vf_domain:
    path: ../../packages/vf_domain
  vf_network:
    path: ../../packages/vf_network
  vf_protocol:
    path: ../../packages/vf_protocol
  vf_security:
    path: ../../packages/vf_security
  vf_sync:
    path: ../../packages/vf_sync
  vf_transfer:
    path: ../../packages/vf_transfer
  vf_ui:
    path: ../../packages/vf_ui
  window_manager: ^0.5.2
  workmanager: ^0.10.10

dev_dependencies:
  build_runner: ^2.16.1
  dio: ^5.11.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.2.16
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  riverpod_generator: ^4.0.9

flutter:
  generate: true
  uses-material-design: true
