name: vaultflow_server
description: VaultFlow API — auth, sync, and resumable chunked file transfer (Dart Frog).
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  crypto: ^3.0.7
  cryptography: ^2.9.0
  dart_frog: ^1.2.6
  dart_jsonwebtoken: ^3.4.1
  meta: ^1.16.0
  minio: ^3.5.8
  path: ^1.9.1
  postgres: ^3.5.12
  sentry: ^9.30.0
  shelf: ^1.4.2
  vf_core:
    path: ../../packages/vf_core
  vf_protocol:
    path: ../../packages/vf_protocol

dev_dependencies:
  dart_frog_lint: ^0.1.0
  mocktail: ^1.0.5
  test: ^1.25.0
